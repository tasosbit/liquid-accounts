packages:
  - projects/*
  - projects/use-wallet/packages/*
  - projects/use-wallet-ui/packages/*
linkWorkspacePackages: true
onlyBuiltDependencies:
  - "@algorandfoundation/puya-ts"
  - bigint-buffer
  - esbuild
  - keccak
  - sharp
  - workerd
overrides:
  typescript: 5.9.3 # pinned to fix build issues across workspace
  viem: 2.46.3 # pinned to match use-wallet-ui submodule
  axios: ^1.16.0 # frontend>@allbridge>axios, frontend>@allbridge>axios>tronweb>axios
  lodash: ^4.18.1 # use-wallet-ui>react>vite-plugin-dts>@microsoft/api-extractor>lodash
  fast-uri: ^3.1.2 # evm-logicsig>better-npm-audit>table>ajv>fast-uri
  devalue: ^5.8.1 # use-wallet>@sveltejs/kit>devalue
  js-cookie: ^3.0.7 # use-wallet>@vue/test-utils>js-beautify>js-cookie
  vitest: "^4.1.0" # use-wallet>vitest, use-wallet-ui>react>vitest
  shell-quote: ^1.8.4 # use-wallet-ui>liquid-companion-extension>concurrently>shell-quote
  esbuild: ^0.28.1 # dfx>wrangler>esbuild, use-wallet>vite>esbuild
  "form-data@4": ^4.0.6 # frontend>@allbridge>axios>form-data
  "vite@6": ^6.4.3 # use-wallet>vite, use-wallet-ui>algo-x-evm-ui>vite
  "ws@7": ^7.5.11 # frontend>@allbridge/bridge-core-sdk>...>ws
  "ws@8": ^8.21.0 # dfx>wrangler>miniflare>ws, evm-logicsig>ethers>ws, frontend>@allbridge>@stacks/blockchain-api-client>ws
  "minimatch@9": ^9.0.9 # evm-logicsig>@vitest/coverage-v8>test-exclude>minimatch, use-wallet>@vue/test-utils>...>minimatch
  "minimatch@10": ^10.2.5 # evm-logicsig>@algorandfoundation/puya-ts>minimatch
  "picomatch@4": ^4.0.4 # dfx>vitest>picomatch
auditConfig:
  ignoreCves:
    - CVE-2025-3194 # bigint-buffer: no upstream patch; vuln is in @allbridge's Solana path, unused by xChain
    - CVE-2025-66020 # valibot: v0 to v1 override breaks @mysten/sui build; vuln is in @allbridge's Sui path, unused by xChain
minimumReleaseAgeExclude:
  - "form-data@4.0.6" # security fix for GHSA-hmw2-7cc7-3qxx, remove once minimum release age is accomplished
  - "esbuild@0.28.1" # security fix for GHSA-gv7w-rqvm-qjhr, remove this and below binaries once minimum release age is accomplished
  - "@esbuild/aix-ppc64@0.28.1"
  - "@esbuild/android-arm@0.28.1"
  - "@esbuild/android-arm64@0.28.1"
  - "@esbuild/android-x64@0.28.1"
  - "@esbuild/darwin-arm64@0.28.1"
  - "@esbuild/darwin-x64@0.28.1"
  - "@esbuild/freebsd-arm64@0.28.1"
  - "@esbuild/freebsd-x64@0.28.1"
  - "@esbuild/linux-arm@0.28.1"
  - "@esbuild/linux-arm64@0.28.1"
  - "@esbuild/linux-ia32@0.28.1"
  - "@esbuild/linux-loong64@0.28.1"
  - "@esbuild/linux-mips64el@0.28.1"
  - "@esbuild/linux-ppc64@0.28.1"
  - "@esbuild/linux-riscv64@0.28.1"
  - "@esbuild/linux-s390x@0.28.1"
  - "@esbuild/linux-x64@0.28.1"
  - "@esbuild/netbsd-arm64@0.28.1"
  - "@esbuild/netbsd-x64@0.28.1"
  - "@esbuild/openbsd-arm64@0.28.1"
  - "@esbuild/openbsd-x64@0.28.1"
  - "@esbuild/openharmony-arm64@0.28.1"
  - "@esbuild/sunos-x64@0.28.1"
  - "@esbuild/win32-arm64@0.28.1"
  - "@esbuild/win32-ia32@0.28.1"
  - "@esbuild/win32-x64@0.28.1"
